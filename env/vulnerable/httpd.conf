# =============================================================================
# httpd.conf — Vulnerable Reference Configuration (Apache 2.4.49)
#
# CONTEXT:
#   This config reproduces the misconfiguration conditions documented in
#   real-world servers that were vulnerable to CVE-2021-41773 / CVE-2021-42013.
#
#   Key settings that make this vulnerable:
#     1. mod_cgi is loaded — allows CGI script execution
#     2. <Directory /> uses "Require all granted" — no path-based ACL
#     3. cgi-bin alias has Options +ExecCGI — enables the CGI routing path
#     4. ServerTokens Full — exposes the full version string in Server header
#        (this is what the detect_cve.py banner check inspects)
#
# WARNING:
#   These settings are intentionally insecure for lab research purposes.
#   NEVER use this config in any internet-facing or production environment.
# =============================================================================

# -----------------------------------------------------------------------
# Core server identity settings
# -----------------------------------------------------------------------
ServerRoot "/usr/local/apache2"

# Full token mode exposes "Apache/2.4.49 (Unix)" in the Server: header.
# The detection scanner's passive check relies on this banner.
ServerTokens Full
ServerSignature On

# Bind to all interfaces within the container (network isolation is
# enforced externally by docker-compose port-binding to 127.0.0.1).
Listen 80

# -----------------------------------------------------------------------
# Module loading — load only what is needed for the lab
# -----------------------------------------------------------------------
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule unixd_module modules/mod_unixd.so

# CGI module — required for the CGI handler routing check (mod_cgi vector).
# This module causes Apache to treat matched requests as CGI scripts and
# execute them, forwarding POST body to stdin.
LoadModule cgi_module modules/mod_cgi.so

# -----------------------------------------------------------------------
# Process identity
# -----------------------------------------------------------------------
User daemon
Group daemon

# -----------------------------------------------------------------------
# Document root and global directory policy
# -----------------------------------------------------------------------

# THE VULNERABLE SETTING:
# "Require all granted" on the filesystem root means any path that Apache
# resolves to (after its URL normalization) can be served, including files
# outside the document root if the URL normalization is bypassed.
# In a default Apache install, this is "Require all denied".
<Directory />
    AllowOverride None
    Require all granted
    Options +FollowSymLinks
</Directory>

# Standard document root — normal content served from here
DocumentRoot "/usr/local/apache2/htdocs"

<Directory "/usr/local/apache2/htdocs">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

DirectoryIndex index.html

# -----------------------------------------------------------------------
# Icons alias — required for path-traversal base path
# -----------------------------------------------------------------------
# The /icons/ URL alias maps to /usr/local/apache2/icons/ on the filesystem.
# This is the entry-point the traversal payload uses to escape the document
# root. It is present in the default Apache install; we define it explicitly
# here because we replaced the full default httpd.conf.
#
# Traversal depth from /usr/local/apache2/icons/:
#   Step 1: .%2e  -> /usr/local/apache2/
#   Step 2: .%2e  -> /usr/local/
#   Step 3: .%2e  -> /usr/
#   Step 4: .%2e  -> /          (filesystem root)
#   Step 5: etc/passwd -> /etc/passwd
Alias /icons/ "/usr/local/apache2/icons/"

<Directory "/usr/local/apache2/icons">
    Options Indexes MultiViews
    AllowOverride None
    Require all granted
</Directory>

# -----------------------------------------------------------------------
# CGI-bin alias configuration
# -----------------------------------------------------------------------

# The ScriptAlias maps /cgi-bin/ URL prefix to the filesystem cgi-bin dir.
# Options +ExecCGI enables CGI execution for this directory.
#
# VULNERABILITY TRIGGER:
# The path-traversal flaw in ap_normalize_path allows a URL like:
#   /cgi-bin/.%2e/.%2e/.%2e/bin/sh
# to be resolved to /bin/sh while still matching the /cgi-bin/ ScriptAlias.
# Apache then treats /bin/sh as a CGI script and executes it.
ScriptAlias /cgi-bin/ "/usr/local/apache2/cgi-bin/"

<Directory "/usr/local/apache2/cgi-bin">
    Options +ExecCGI
    AllowOverride None
    Require all granted
    AddHandler cgi-script .sh .cgi .pl
</Directory>

# -----------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------
ErrorLog /proc/self/fd/2
LogLevel warn

LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /proc/self/fd/1 combined

# -----------------------------------------------------------------------
# MIME types
# -----------------------------------------------------------------------
TypesConfig conf/mime.types
