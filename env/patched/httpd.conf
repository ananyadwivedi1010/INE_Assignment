# =============================================================================
# httpd.conf — Patched Reference Configuration (Apache 2.4.51)
#
# CONTEXT:
#   This config follows secure Apache hardening guidelines for the patched
#   version. It is used to verify that the detection scanner correctly
#   returns a PATCHED / SECURE verdict and that traversal requests are
#   rejected.
#
#   Key hardening settings:
#     1. mod_cgi is NOT loaded — CGI execution disabled
#     2. <Directory /> uses "Require all denied" — default-deny ACL
#     3. ServerTokens Prod — suppresses detailed version from Server header
#        (the scanner should detect 2.4.51 is not in the vulnerable range)
#     4. No ScriptAlias with ExecCGI on sensitive paths
# =============================================================================

# -----------------------------------------------------------------------
# Core server identity
# -----------------------------------------------------------------------
ServerRoot "/usr/local/apache2"

# Prod mode suppresses minor/patch version from Server header.
# Server: header will read "Apache" only, not "Apache/2.4.51 (Unix)".
# The scanner must handle this gracefully (PATCHED / SECURE via version check
# or "not vulnerable" determination from non-responsive probe).
ServerTokens Prod
ServerSignature Off

Listen 80

# -----------------------------------------------------------------------
# Module loading — minimal, no CGI
# -----------------------------------------------------------------------
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule unixd_module modules/mod_unixd.so

# NOTE: mod_cgi is intentionally NOT loaded here.
# This removes the CGI execution vector entirely.

# -----------------------------------------------------------------------
# Process identity
# -----------------------------------------------------------------------
User daemon
Group daemon

# -----------------------------------------------------------------------
# Secure global directory policy
# -----------------------------------------------------------------------

# SECURE SETTING:
# "Require all denied" is the correct default. Only explicitly configured
# directories are accessible.
<Directory />
    AllowOverride None
    Require all denied
    Options None
</Directory>

DocumentRoot "/usr/local/apache2/htdocs"

<Directory "/usr/local/apache2/htdocs">
    Options None
    AllowOverride None
    Require all granted
</Directory>

DirectoryIndex index.html

# -----------------------------------------------------------------------
# CGI-bin — present but NOT executable
# -----------------------------------------------------------------------
# The directory exists but ExecCGI is not enabled and mod_cgi is not loaded.
# Any request routed here that attempts traversal will receive 403 Forbidden.
<Directory "/usr/local/apache2/cgi-bin">
    Options None
    AllowOverride None
    Require all denied
</Directory>

# -----------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /proc/self/fd/1 combined

# -----------------------------------------------------------------------
# MIME types
# -----------------------------------------------------------------------
TypesConfig conf/mime.types
