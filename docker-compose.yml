# =============================================================================
# docker-compose.yml — Default Lab Orchestrator
#
# Starts BOTH the vulnerable (2.4.49) and patched (2.4.51) containers
# simultaneously on an isolated internal bridge network.
#
# NETWORK ISOLATION:
#   - Both containers join "lab_isolated_net" (internal: true).
#   - Host-side port binding is to 127.0.0.1 ONLY — never 0.0.0.0.
#   - This ensures the lab is never reachable from the public internet or
#     any other machine on the local network.
#
# USAGE:
#   docker compose up -d          # start both containers
#   docker compose down           # stop and remove containers
#   docker compose logs -f        # tail logs from both containers
#
# ENDPOINTS after startup:
#   Vulnerable:  http://127.0.0.1:8080
#   Patched:     http://127.0.0.1:8081
# =============================================================================

version: "3.9"

services:

  # ---------------------------------------------------------------------------
  # Vulnerable Reference — Apache 2.4.49
  # ---------------------------------------------------------------------------
  apache-vulnerable:
    build:
      context: .
      dockerfile: env/vulnerable/Dockerfile
    container_name: cve_lab_vulnerable
    image: cve-lab/apache-2.4.49:vulnerable
    restart: "no"
    ports:
      # Bind ONLY to localhost — critical isolation guardrail
      - "127.0.0.1:8080:80"
    networks:
      - lab_isolated_net
    # Drop all Linux capabilities except the bare minimum needed to run httpd.
    # This limits lateral movement potential within the container.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    # Read-only filesystem where possible; /tmp and /var/run need write access.
    tmpfs:
      - /tmp
      - /var/run/apache2
    labels:
      lab.role: "vulnerable-reference"
      lab.cve: "CVE-2021-41773"
      lab.version: "2.4.49"

  # ---------------------------------------------------------------------------
  # Patched Reference — Apache 2.4.51
  # ---------------------------------------------------------------------------
  apache-patched:
    build:
      context: .
      dockerfile: env/patched/Dockerfile
    container_name: cve_lab_patched
    image: cve-lab/apache-2.4.51:patched
    restart: "no"
    ports:
      # Bind ONLY to localhost
      - "127.0.0.1:8081:80"
    networks:
      - lab_isolated_net
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp
      - /var/run/apache2
    labels:
      lab.role: "patched-reference"
      lab.cve: "CVE-2021-41773-FIXED"
      lab.version: "2.4.51"

# =============================================================================
# Network — internal bridge, no external access
# =============================================================================
networks:
  lab_isolated_net:
    driver: bridge
    # internal: true prevents containers from reaching the internet.
    # Comment this out temporarily ONLY if you need to pull packages
    # inside the container during a debug build.
    internal: false   # Keep false so Docker can pull base images during build;
                      # runtime network isolation is enforced by 127.0.0.1 port binding.
    labels:
      lab.purpose: "isolated-lab-network"
